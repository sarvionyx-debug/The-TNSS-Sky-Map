<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The (TNSS) Sky Map</title>
<style>
  :root { --ink:#dfe7f5; --dim:#8ea0bf; --line:rgba(140,170,220,.28); --panel:rgba(6,10,22,.78); --accent:#e9c46a; }
  * { box-sizing: border-box; }
  html, body { height:100%; margin:0; background:#04070f; color:var(--ink); font:14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; overflow:hidden; }
  canvas { display:block; width:100%; height:100%; touch-action:none; cursor:grab; }
  canvas:active { cursor:grabbing; }
  .panel { position:absolute; background:var(--panel); border:1px solid var(--line); border-radius:10px; backdrop-filter:blur(6px); }
  #hud { top:max(10px, env(safe-area-inset-top)); left:10px; padding:10px 14px; max-width:min(330px, 70vw); }
  #hud h1 { font:600 17px Georgia, "Times New Roman", serif; margin:0 0 2px; letter-spacing:.2px; }
  #hud div { color:var(--dim); font-size:12.5px; }
  #hud b { color:var(--ink); font-weight:600; }
  #ctl { bottom:max(10px, env(safe-area-inset-bottom)); left:10px; width:min(330px, calc(100vw - 20px)); padding:0; }
  #ctl summary { padding:9px 14px; cursor:pointer; color:var(--accent); font-weight:600; }
  #ctl .body { max-height:46vh; overflow-y:auto; padding:0 14px 12px; display:grid; grid-template-columns:1fr 1fr; gap:8px 10px; }
  label { display:flex; flex-direction:column; gap:3px; font-size:12px; color:var(--dim); }
  .wide { grid-column:1 / -1; }
  input[type=number], input[type=datetime-local], input[type=text], select { background:#0b1224; color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:5px 7px; font:inherit; min-width:0; }
  .chk { flex-direction:row; align-items:center; gap:6px; color:var(--ink); }
  button { background:#14213f; color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:6px 10px; font:inherit; cursor:pointer; }
  button:hover { background:#1d2f58; }
  #card { top:max(10px, env(safe-area-inset-top)); right:10px; width:min(290px, calc(100vw - 20px)); padding:12px 14px; }
  #card[hidden] { display:none; }
  #card h2 { font:600 19px Georgia, serif; margin:0 0 6px; }
  #card .r { display:flex; justify-content:space-between; gap:10px; padding:3px 0; border-top:1px solid var(--line); font-size:12.5px; }
  #card .r span { color:var(--dim); } #card .r b { font-weight:500; text-align:right; }
  #card .note { margin-top:6px; color:var(--accent); font-size:12.5px; }
  #card .x { position:absolute; top:6px; right:8px; padding:2px 7px; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  #msg { position:absolute; right:12px; bottom:12px; color:var(--dim); font-size:12px; text-align:right; max-width:30vw; }
  label, select, input { min-width:0; max-width:100%; }
  #msg.err { color:#ff9a8a; }
  #card .hop { margin-top:8px; width:100%; background:#2a2410; border-color:rgba(233,196,106,.55); color:var(--accent); font-weight:600; }
  #guide { bottom:44px; right:10px; width:min(340px, calc(100vw - 20px)); padding:12px 14px; z-index:5; }
  #guide[hidden] { display:none; }
  #guide h2 { font:600 17px Georgia, serif; margin:0 0 2px; padding-right:24px; }
  #guide .sub { color:var(--dim); font-size:12px; } #guide p { margin:8px 0 10px; font-size:13.5px; line-height:1.5; }
  #guide .bar { height:3px; background:var(--line); border-radius:2px; margin-top:6px; } #guide .bar i { display:block; height:100%; background:var(--accent); border-radius:2px; }
  #guide .nav { display:flex; gap:6px; } #guide .nav button { flex:1; } #guide button:disabled { opacity:.4; cursor:default; }
  #guide .x { position:absolute; top:8px; right:8px; padding:2px 7px; }
  #coord { position:absolute; left:50%; bottom:10px; transform:translateX(-50%); padding:4px 10px; font-size:12px; color:var(--dim); white-space:nowrap; pointer-events:none; }
  @media (max-width:820px) { #coord { display:none; } }
  .up { display:flex; justify-content:space-between; width:100%; margin-top:4px; font-size:12px; text-align:left; } .up span { color:var(--dim); }
  body.red { filter:grayscale(1) sepia(1) hue-rotate(-50deg) saturate(6) brightness(.8); }
  #zb { position:absolute; right:10px; top:50%; transform:translateY(-50%); display:flex; flex-direction:column; gap:6px; z-index:4; } #zb button { width:38px; height:38px; font-size:18px; padding:0; }
</style>

<script>
const D2R = Math.PI / 180;
const $ = id => document.getElementById(id);
const canvas = $('c'), ctx = canvas.getContext('2d');
let W = 0, H = 0, dpr = 1;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resize(); addEventListener('resize', resize);

// ── State ───────────────────────────────────────────────
let lat = 12.97, lon = 77.59;
let simMs = Date.now(), speed = 1;
const MINFOV = 0.0002;
const view = { az: 180, alt: 55, fov: 110 };
const opt = { lines: true, names: true, grid: false, ecl: true, dso: true, ast: true, sats: true, mw: true, met: true, eq: false };

// ── Data ────────────────────────────────────────────────
let N = 0, sx, sy, sz, smag, scol = [], sid = [];
let segs = new Float32Array(0), nSeg = 0;
let cons = [];                 // {id, name, v:[x,y,z]}
let starNames = {};

const BASES = ['https://raw.githubusercontent.com/ofrohn/d3-celestial/master/data/',
               'https://cdn.jsdelivr.net/gh/ofrohn/d3-celestial@master/data/'];
async function getJSON(file) {          // browser Cache Storage first (instant on repeat visits), then the network with a timeout
  let last, store = null; try { store = await caches.open('skymap-data-v1'); } catch (e) {}
  for (const b of BASES) {
    try {
      const u = b + file, hit = store && await store.match(u); if (hit) return await hit.json();
      const r = await fetch(u, { signal: AbortSignal.timeout(20000) }); if (!r.ok) throw new Error(r.status);
      if (store) store.put(u, r.clone()).catch(() => {});
      return await r.json();
    } catch (e) { last = e; }
  }
  throw last;
}
const eqVec = (raDeg, decDeg) => {
  const a = raDeg * D2R, d = decDeg * D2R;
  return [Math.cos(d) * Math.cos(a), Math.cos(d) * Math.sin(a), Math.sin(d)];
};
// B–V colour index → star colour
const BV = [[-0.3,155,176,255],[0.0,200,215,255],[0.4,248,247,255],[0.8,255,236,200],[1.2,255,200,140],[1.8,255,160,100]];
function bvColor(bv) {
  bv = isNaN(bv) ? 0.6 : bv;
  let i = 0; while (i < BV.length - 2 && bv > BV[i + 1][0]) i++;
  const a = BV[i], b = BV[i + 1], t = Math.max(0, Math.min(1, (bv - a[0]) / (b[0] - a[0])));
  return `rgb(${Math.round(a[1] + (b[1] - a[1]) * t)},${Math.round(a[2] + (b[2] - a[2]) * t)},${Math.round(a[3] + (b[3] - a[3]) * t)})`;
}

async function loadAll() {
  const msg = $('msg');
  try {
    const sd = await getJSON('stars.6.json');
    const f = sd.features; N = f.length;
    sx = new Float32Array(N); sy = new Float32Array(N); sz = new Float32Array(N); smag = new Float32Array(N);
    f.forEach((s, i) => {
      const [lo, la] = s.geometry.coordinates, p = s.properties || {};
      const v = eqVec(lo, la);
      sx[i] = v[0]; sy[i] = v[1]; sz[i] = v[2];
      smag[i] = Number(p.mag); scol[i] = bvColor(parseFloat(p.bv)); sid[i] = s.id;
    });
  } catch (e) {
    msg.className = 'err';
    msg.textContent = 'Could not load star data. Check your internet connection and reload.';
    return;
  }
  try {
    const ld = await getJSON('constellations.lines.json');
    const out = [];
    ld.features.forEach(ft => {
      let cx = 0, cy = 0, cz = 0, n = 0;
      (ft.geometry.coordinates || []).forEach(line => {
        for (let i = 0; i < line.length; i++) {
          const v = eqVec(line[i][0], line[i][1]); cx += v[0]; cy += v[1]; cz += v[2]; n++;
          if (i) { const u = eqVec(line[i - 1][0], line[i - 1][1]); out.push(u[0], u[1], u[2], v[0], v[1], v[2]); }
        }
      });
      if (n) { const m = Math.hypot(cx, cy, cz) || 1; cons.push({ id: ft.id, name: ft.id, v: [cx / m, cy / m, cz / m] }); }
    });
    segs = Float32Array.from(out); nSeg = out.length / 6;
  } catch (e) { msg.className = 'err'; msg.textContent = 'Constellation lines unavailable – showing stars only.'; }
  // Names are optional extras
  getJSON('starnames.json').then(d => { starNames = d || {}; }).catch(() => {});
  getJSON('constellations.json').then(d => {
    const by = {}; (d.features || []).forEach(ft => { const p = ft.properties || {}; by[ft.id] = p.en || p.name; });
    cons.forEach(c => { if (by[c.id]) c.name = by[c.id]; });
  }).catch(() => {});
  if (!msg.classList.contains('err')) setTimeout(() => { msg.style.opacity = 0; }, 6000);
}

const EL = {  // N, N', i, i', w, w', a, e, e', M, M'

  Sun:    [0,0,0,0,282.9404,4.70935e-5,1,0.016709,-1.151e-9,356.047,0.9856002585],

};
const PCOL = { Mercury:'#c9c2b8', Venus:'#fff3c4', Mars:'#ff7b54', Jupiter:'#f2d9b0', Saturn:'#e8d28a', Uranus:'#a9e8ec', Neptune:'#6f8fff' };
const PSIZE = { Mercury:2.6, Venus:4.6, Mars:3.2, Jupiter:4.2, Saturn:3.4, Uranus:2.6, Neptune:2.3 };

function orbit(e, d) {
  const n = (e[0] + e[1] * d) * D2R, inc = (e[2] + e[3] * d) * D2R, w = (e[4] + e[5] * d) * D2R;
  const a = e[6], ecc = e[7] + e[8] * d, M = (e[9] + e[10] * d) * D2R;
  let E = M + ecc * Math.sin(M) * (1 + ecc * Math.cos(M));
  for (let k = 0; k < 6; k++) E = M + ecc * Math.sin(E);

function starLabel(i) { const n = starNames[sid[i]] || {}, t = n.name || n.en || (n.bayer ? `${n.bayer} ${n.c || ''}`.trim() : ''); return t || `a mag ${smag[i].toFixed(1)} star`; }

function dirWords(v0, v1) {                 // direction as seen by an observer facing the sky

function startHop() {

  const path = planHop(b.v), nodes = (path || []).map(i => { const v = [sx[i], sy[i], sz[i]]; return { v, label: starLabel(i), mag: smag[i], con: nearCon(v) }; });
  if (!path) nodes.push({ v: b.v, label: 'a bright star nearby', mag: 2, con: null });
  const tip = b.kind === 'dso' ? `It is a ${DSO_NAMES[b.cls].toLowerCase()}, mag ${b.mag < 90 ? b.mag.toFixed(1) : '?'}, about ${b.dim >= 60 ? (b.dim / 60).toFixed(1) + '°' : b.dim.toFixed(0) + '′'} across. ` + (b.mag <= 5.5 ? 'Visible by eye from a dark site; binoculars help.' : b.mag <= 8.5 ? 'Use binoculars or a small telescope.' : 'You will need a telescope.')
    : b.ast ? `It is faint (mag ${b.mag.toFixed(1)}): use a telescope. It looks like a star that shifts from night to night.` : `${b.name} is bright (mag ${b.mag.toFixed(1)}) and should stand out clearly.`;

function hopText(i) {

  if (i === 0) {
    const h = toH(...n.v), alt = Math.asin(h[2]) / D2R, az = (Math.atan2(h[0], h[1]) / D2R + 360) % 360;
    return `Start at <b>${n.label}</b>${n.con ? ` in ${n.con}` : ''}. ` + (n.label.startsWith('a mag') ? 'Pick the brightest star in that part of the sky. ' : `It is a ${bright(n.mag)} star (mag ${n.mag.toFixed(1)}). `) + (alt > 0 ? `Right now it is ${alt.toFixed(0)}° up in the ${compass(az)}. Directions below are as you face the sky. Tip: at arm's length a pinky is about 1°, three fingers 5°, a fist 10°.` : 'It is below the horizon right now. Change the date and time so it is up.');
  }

function renderGuide() {

    `<div class="nav"><button onclick="hopStep(-1)" ${i ? '' : 'disabled'}>◀ Back</button><button onclick="hopAll()">Whole path</button><button onclick="${i < n - 1 ? 'hopStep(1)' : 'closeGuide()'}">${i < n - 1 ? 'Next ▶' : 'Done'}</button></div>`;

function goStep(i) {
  const g = guide; g.step = i; const n = g.nodes[i], a = g.nodes[i - 1] || n;
  const v = [a.v[0] + n.v[0], a.v[1] + n.v[1], a.v[2] + n.v[2]], m = Math.hypot(...v) || 1;

const hopStep = k => goStep(Math.max(0, Math.min(guide.nodes.length - 1, guide.step + k)));
function hopAll() {

  ctx.save(); ctx.strokeStyle = 'rgba(233,196,106,.8)'; ctx.lineWidth = 1.6; ctx.setLineDash([7, 5]); ctx.beginPath();

  });

// ── Cursor readout, "what's up now", keyboard, night vision ──
const fovText = f => f >= 10 ? f.toFixed(0) + '°' : f >= 1 ? f.toFixed(1) + '°' : f >= 1 / 60 ? (f * 60).toFixed(1) + '′' : (f * 3600).toFixed(0) + '″';
function updateExtras() {
  const m = mouse || [W / 2, H / 2], x = m[0] - W / 2, y = H / 2 - m[1], th = 2 * Math.atan(Math.hypot(x, y) / (2 * S)), ph = Math.atan2(y, x), st = Math.sin(th) * Math.cos(ph), su = Math.sin(th) * Math.sin(ph), c = Math.cos(th);
